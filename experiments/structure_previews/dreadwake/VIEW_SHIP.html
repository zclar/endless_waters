let prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,`attribute vec3 p;attribute vec3 c;uniform mat4 m;varying vec3 col;void main(){gl_Position=m*vec4(p,1.);col=c;}`));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 col;void main(){gl_FragColor=vec4(col,1.);}`));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);for(const [name,offset] of [['p',0],['c',12]]){let a=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,24,offset)}gl.enable(gl.DEPTH_TEST);
function rebuild(){let data=SHIPS[variant],cut=document.getElementById('cut').value,blocks=data.blocks.filter(p=>cut==='full'||(cut==='section'?p[0]<=24:p[1]<Number(cut))),map=new Map(blocks.map(p=>[p.slice(0,3).join(','),data.palette[p[3]]])),shapes=new Map();
for(const [x,y,z,i] of blocks)shapes.set(`${x},${y},${z}`,shape(data.palette[i],(dx,dz)=>map.get(`${x+dx},${y},${z+dz}`)));
let verts=[];function box(x,y,z,bx,color,full=false){for(const [normal,ps] of faces){let other=shapes.get(`${x+normal[0]},${y+normal[1]},${z+normal[2]}`);if(full&&other?.length===1&&other[0]===B)continue;let shade=.72+.28*Math.max(0,normal[0]*.35+normal[1]*.84-normal[2]*.4);for(const j of [0,1,2,0,2,3]){let p=ps[j];verts.push(x+bx[0]+p[0]*(bx[3]-bx[0])-24,y+bx[1]+p[1]*(bx[4]-bx[1])-25,z+bx[2]+p[2]*(bx[5]-bx[2])-58,...color.map(c=>c/255*shade))}}}
for(const [x,y,z,i] of blocks){let b=data.palette[i],v=.96+((x*31+y*17+z*13)%11)*.008,c=b.color.map(a=>a*v);for(const bx of shapes.get(`${x},${y},${z}`))box(x,y,z,bx,c,bx===B)}
if(document.getElementById('crew').checked)for(const [x,y,z] of data.crew){if(cut!=='full'&&(cut==='section'?x>24:y>=Number(cut)))continue;box(x,y,z,[.2,0,.2,.8,1.25,.8],[153,43,39]);box(x,y,z,[.22,1.25,.22,.78,1.8,.78],[161,173,166])}
count=verts.length/6;gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);document.getElementById('status').textContent=`${variant[0].toUpperCase()+variant.slice(1)} · ${data.crew.length} planned pillagers · 116 × 49 × 76 block envelope`;draw()}
function draw(){let dpr=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(.79,.88,.88,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let sy=Math.sin(yaw),cy=Math.cos(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch),s=2/zoom,aspect=w/h;let m=new Float32Array([cy*s/aspect,-sy*sp*s,-sy*cp/220,0,0,cp*s,-sp/220,0,-sy*s/aspect,-cy*sp*s,-cy*cp/220,0,0,-.13,0,1]);gl.uniformMatrix4fv(gl.getUniformLocation(prog,'m'),false,m);gl.drawArrays(gl.TRIANGLES,0,count)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;document.querySelectorAll('[data-v]').forEach(a=>a.setAttribute('aria-pressed',String(a===b)));rebuild()});document.getElementById('cut').onchange=rebuild;document.getElementById('crew').onchange=rebuild;document.getElementById('reset').onclick=()=>{yaw=-.85;pitch=.45;zoom=fitZoom();draw()};window.addEventListener('resize',draw);
const pointers=new Map();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY])};canvas.onpointerup=canvas.onpointercancel=e=>pointers.delete(e.pointerId);canvas.onpointermove=e=>{let old=pointers.get(e.pointerId);if(!old)return;if(pointers.size===2){let other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1],before=Math.hypot(old[0]-other[0],old[1]-other[1]),after=Math.hypot(e.clientX-other[0],e.clientY-other[1]);if(after>5)zoom=Math.max(15,Math.min(400,zoom*before/after))}else{yaw+=(e.clientX-old[0])*.008;pitch=Math.max(-.3,Math.min(1.5,pitch+(e.clientY-old[1])*.008))}pointers.set(e.pointerId,[e.clientX,e.clientY]);draw()};canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(15,Math.min(400,zoom*Math.exp(e.deltaY*.001)));draw()},{passive:false});rebuild();
}catch(e){fail(e)}}
